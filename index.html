<!doctype html>
<html lang="et">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171a16">
  <title>Farlands — Valheim</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      min-height: 100svh;
      background: #171a16 url('kaart.webp') center top / cover no-repeat fixed;
      color: #fff2d3;
      font-family: Georgia, 'Times New Roman', serif;
    }
    .mist {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      /* Keep the title clear while fog drifts over the map below it. */
      mask-image: linear-gradient(transparent 8%, #0006 30%, #000 60%);
      -webkit-mask-image: linear-gradient(transparent 8%, #0006 30%, #000 60%);
    }
    .mist-layer {
      position: absolute;
      inset: -15% -55%;
      background:
        radial-gradient(ellipse 19% 9% at 16% 52%, #fff6, transparent 100%),
        radial-gradient(ellipse 24% 12% at 39% 65%, #ffffff52, transparent 100%),
        radial-gradient(ellipse 18% 8% at 61% 48%, #ffffff47, transparent 100%),
        radial-gradient(ellipse 26% 13% at 83% 77%, #ffffff5c, transparent 100%);
      filter: blur(22px);
      opacity: .55;
      animation: mist-drift 75s ease-in-out infinite alternate;
      will-change: transform;
    }
    .mist-layer:nth-child(2) {
      inset: -5% -65%;
      opacity: .3;
      animation-duration: 110s;
      animation-delay: -48s;
      animation-direction: alternate-reverse;
      transform: scaleY(-1);
    }
    @keyframes mist-drift {
      from { transform: translate3d(-14%, 3%, 0); }
      to { transform: translate3d(14%, -4%, 0); }
    }
    main { position: relative; z-index: 1; min-height: 100svh; display: grid; place-items: center; padding: 24px; }
    .enter {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 240px;
      min-height: 72px;
      padding: 18px 42px;
      border: 2px solid #be9a58;
      border-radius: 3px;
      background: repeating-linear-gradient(135deg, #ffffff03 0 1px, transparent 1px 7px), linear-gradient(#363936, #181e1b);
      box-shadow: 0 5px 0 #101510, 0 0 0 4px #6b592f, inset 0 0 0 5px #151b17, inset 0 0 25px #000;
      color: #ffe7ad;
      text-decoration: none;
      text-transform: uppercase;
      font-size: clamp(24px, 4vw, 32px);
      font-weight: bold;
      letter-spacing: .17em;
      text-indent: .17em;
      text-shadow: 0 2px 3px #000;
      transition: filter .25s, transform .25s, box-shadow .35s;
    }
    .enter::before, .enter::after {
      position: absolute; left: 0; width: 100%; text-align: center;
      font: 13px Georgia, serif; letter-spacing: 14px; text-indent: 14px;
      color: #a38b54; content: 'ᚠ ᚢ ᚦ ᚨ ᚱ';
      transition: color .4s, text-shadow .4s;
      pointer-events: none;
    }
    .enter::before { top: -23px; }
    .enter::after { bottom: -24px; }
    .enter:hover, .enter:focus-visible {
      filter: brightness(1.14); transform: translateY(-3px);
      box-shadow: 0 5px 0 #101510, 0 0 0 4px #ab8649, 0 0 30px #f1b54170, inset 0 0 22px #b68b3426;
    }
    .enter:hover::before, .enter:hover::after, .enter:focus-visible::before, .enter:focus-visible::after {
      color: #ffe5a0; text-shadow: 0 0 9px #ffd45d;
    }
    .enter.departing { pointer-events: none; animation: dissolve .65s ease-in forwards; }
    @keyframes dissolve {
      0% { opacity: 1; filter: brightness(1.3) blur(0); }
      35% { opacity: .9; filter: brightness(1.8) blur(1px); }
      100% { opacity: 0; filter: brightness(1.4) blur(14px); transform: scale(1.12) translateY(-8px); }
    }
    .enter:active { transform: translateY(1px); }
    .enter:focus-visible { outline: 3px solid #fff2cb; outline-offset: 8px; }
    .help {
      z-index: 2;
      position: fixed;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      width: min(440px, calc(100% - 32px));
      padding: 12px 18px;
      border: 1px solid #c5a36466;
      border-radius: 5px;
      background: #17140fe8;
      text-align: center;
      font: 14px/1.6 system-ui, sans-serif;
      box-shadow: 0 3px 18px #0005;
    }


    code { color: #ffe7ad; user-select: all; overflow-wrap: anywhere; }
    .server-stats { margin-top: 7px; display: flex; justify-content: center; flex-wrap: wrap; gap: 4px 14px; }
    #server-state::before { content: '●'; color: #c5a364; margin-right: 6px; }
    #server-state[data-state="online"]::before { color: #81ca8b; }
    #server-state[data-state="unreachable"]::before { color: #e4a072; }
    .status-footer { margin-top: 5px; color: #c8bea9; font-size: 12px; }
    #status-refresh { color: #ffe7ad; background: transparent; border: 1px solid #c5a36466; border-radius: 3px; padding: 6px 10px; margin-left: 7px; cursor: pointer; font: inherit; }
    #status-refresh:focus-visible { outline: 2px solid #fff2cb; outline-offset: 3px; }
    #status-refresh:disabled { opacity: .5; cursor: wait; }

    @media (prefers-reduced-motion: reduce) {
      .mist-layer { animation: none; will-change: auto; }
      .enter, .enter::before, .enter::after { transition: none; }
      .enter.departing { animation: none; }
    }
    @media (max-height: 450px) { .help { position: relative; left: auto; bottom: auto; transform: none; margin: 0 auto 18px; } }
  </style>
</head>
<body>
  <div class="mist" aria-hidden="true"><div class="mist-layer"></div><div class="mist-layer"></div></div>
  <main aria-label="Farlands — Valheimi server">
    <a class="enter" href="steam://run/892970//+connect%2083.143.117.49:20414/" aria-label="Sisene Farlandsi serverisse Steami kaudu">Sisene</a>
  </main>
  <div class="help">
    <div>IP: <code>83.143.117.49:20414</code></div>
    <div class="server-stats" aria-live="polite">
      <span id="server-state">Laen staatust…</span>
      <span>Mängijaid: <span id="server-players">—</span></span>
      <span title="Valheimi versioon, mille server avaldab A2S märksõnade väljal.">Mänguversioon: <span id="server-version">—</span></span>
    </div>
    <div class="status-footer"><time id="server-checked">Kontrolli aeg teadmata</time><button id="status-refresh" type="button">Värskenda</button></div>
    <div class="status-footer">Kontroll umbes iga 10 min · nupp laeb viimase tulemuse.</div>
    <noscript>Serveriinfo kuvamiseks luba JavaScript.</noscript>
  </div>
  <script src="status.js" defer></script>
  <script>
    const enter = document.querySelector('.enter');
    let launching = false;
    enter.addEventListener('click', (event) => {
      if (event.ctrlKey || event.metaKey || event.shiftKey || event.altKey) return;
      event.preventDefault();
      if (launching) return;
      launching = true;
      enter.classList.add('departing');
      enter.setAttribute('aria-disabled', 'true');
      const delay = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 650;
      window.setTimeout(() => {
        // Restore the button so the user can retry launching Steam.
        window.setTimeout(() => {
          enter.classList.remove('departing');
          enter.removeAttribute('aria-disabled');
          launching = false;
        }, 2000);
        window.location.href = enter.href;
      }, delay);
    });
  </script>
</body>
</html>
